# Educational baseline. Replace the image and verify it supports UID 10001,
# read-only rootfs, port 8080 and application-specific write paths.
# This file is NOT a deployable application on its own.
services:
  app:
    image: your-reviewed-image:tag
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - internal
networks:
  internal:
    driver: bridge
